name: Julia conformance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit estate repository architecture
        run: python3 tools/audit_estate_layout.py
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - run: julia --project=. -e 'using Pkg; Pkg.test()'
